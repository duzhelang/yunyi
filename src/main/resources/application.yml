server:
  ip: localhost
  port: 9090
  tomcat:
    accesslog:
      enabled: true
      directory: ./logs
      prefix: access
      suffix: .log
      pattern: "%h %l %u %t \"%r\" %s %b \"%{Referer}i\" \"%{User-Agent}i\""
      file-date-format: yyyy-MM-dd
      rename-on-rotate: true

spring:
  config:
    import: optional:classpath:secrets/application-secrets.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/dongfang?serverTimezone=GMT%2b8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "010125"

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 1500MB
      max-request-size: 1500MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

base:

  path: ./
#  path:  System.getProperty("user.dir")
  python: python

files:
  # 用户头像/文件上传目录
  upload:
    path: ${base.path}/files/
  avatar:
    path: ${files.upload.path}avatar/
  common:
    path: ${files.upload.path}common/
  # Python数据上传（训练集/测试集）
  pythonUpload:
    path: ${base.path}/data/
  # Python文件下载
  pythonDownload:
    path: ${base.path}/
  # Json文件下载
  JsonDownload:
    path: ${base.path}/data/json/
  # 预测数据上传
  pythonDataTestUpload:
    path: ${base.path}/data/test/
  # 模型文件目录
  models:
    path: ${base.path}/data/models/
  # 训练日志目录
  trainLogs:
    path: ${base.path}/logs/
  # 相对路径
  pythonExe:
    path: python
  # 训练脚本
  pythonTrainMain:
    path: ${base.path}/python/train.py
  # 预测脚本
  pythonPredictMain:
    path: /python/predict.py
  # 对话脚本（全相对路径）
  pythonChatScript:
    path: ${base.path}/python/diabetes_chat.py
  # 模型文件路径（默认，实际从 sys_model_version 表读取激活模型）
  pythonModelPath:
    path: ${base.path}/data/models/diabetes_model.pth


zhipu:
  api:
    key: ${ZHIPU_API_KEY:}   # 从环境变量读取，未设置时为空
deepseek:
  api:
    api-key: ${DEEPSEEK_API_KEY:}
kimi:
  api:
    api-key: ${KIMI_API_KEY:}
mimo:
  api:
    api-key: ${MIMO_API_KEY:}
mimo-omni:
  api:
    api-key: ${MIMO_OMNI_API_KEY:}
mimo-tts:
  api:
    api-key: ${MIMO_TTS_API_KEY:}
    base-url: https://token-plan-cn.xiaomimimo.com/anthropic

patient-visit:
  max-records: 5

